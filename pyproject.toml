[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcerer"
version = "2.4.4"
description = "Index and search source code in Elasticsearch."
requires-python = ">=3.10"
dependencies = [
    "click==8.1.8",
    "croniter>=6.2.4",
    "elasticsearch==8.17.1",
    "fastmcp==2.14.3",
    "packaging==26.2",
    "python-dotenv>=1.1.0",
    "pyyaml==6.0.2",
    "requests==2.34.2",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sourcerer = "sourcerer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
sourcerer = [
    "elastic/index_templates/*.json",
    "elastic/kibana_saved_objects/*.ndjson",
    "elastic/agent_builder_tools/*.yml",
    "elastic/agent_builder_tools/*.yaml",
    "elastic/agent_builder_tools/experimental/*.yml",
    "elastic/agent_builder_tools/experimental/*.yaml",
    "elastic/agent_builder_agents/*.yml",
    "elastic/agent_builder_agents/*.yaml",
    "elastic/agent_builder_agents/experimental/*.yml",
    "elastic/agent_builder_agents/experimental/*.yaml",
    "elastic/agent_builder_skills/*.yml",
    "elastic/agent_builder_skills/*.yaml",
    "elastic/agent_builder_skills/experimental/*.yml",
    "elastic/agent_builder_skills/experimental/*.yaml",
    "elastic/workflows/*.yml",
    "elastic/workflows/*.yaml",
    "elastic/workflows/experimental/*.yml",
    "elastic/workflows/experimental/*.yaml",
    "benchmarks/*/repos.yml",
    "skills/*/SKILL.md",
]
