# sourcerer.yml - the config passed to `sourcerer index --config` and `sourcerer prune --config`
# (and, for its `hosts:` section only, `sourcerer setup --config`).
#
# Three optional top-level sections:
#   hosts:     override/extend the built-in git-host defaults
#   schedules: coarse, scope-based default indexing cadences (glob wildcards supported)
#   sources:   what to index

# ---------------------------------------------------------------------------------------------
# hosts: OPTIONAL. Omit entirely to use the built-in defaults for all known hosts
# (github, gitlab, bitbucket, codeberg, forgejo, gitea, gogs, sourcehut, launchpad,
# azure-devops, aws-codecommit, google-cloud-source, gcp-ssm). Use this only to customize a known
# host (e.g. a self-hosted host name) or to define a custom host. Values given here are
# merged OVER the defaults (your value wins); anything omitted keeps the shipped default.
#
# Providers like AWS CodeCommit, Azure DevOps, and GCP Secure Source Manager are
# region/project-scoped deployments with no fixed multi-tenant domain. Define a separate
# hosts entry per deployment (e.g. aws-codecommit-us-east-1) with the region or project
# baked directly into the URL templates. git.org and git.repo are then plain, unambiguous
# values with no extra scoping embedded in them.
#
# URL templates use dotted tokens naming the Elasticsearch field the value comes from:
#   {git.host} {git.org} {git.repo} {git.commit}
#   {file.path} {file.directory} {line.number} {line.number_start} {line.number_end}
# The clone URL is substituted by sourcerer; the link templates are shown to the agent, which
# fills the tokens from tool output when it formats a citation.
hosts:
- id: github                  # value of git.host used in _id, index names, and templates
  name: GitHub                # human label, used in the generated citation skill's name
  clone:
    protocol: https           # optional, defaults to "https" (only "https" is supported today)
    url: "https://github.com/{git.org}/{git.repo}.git"
  links:
    directory: "https://github.com/{git.org}/{git.repo}/blob/{git.commit}/{file.directory}"
    file: "https://github.com/{git.org}/{git.repo}/blob/{git.commit}/{file.path}"
    line: "https://github.com/{git.org}/{git.repo}/blob/{git.commit}/{file.path}#L{line.number}"
    line_range: "https://github.com/{git.org}/{git.repo}/blob/{git.commit}/{file.path}#L{line.number_start}-L{line.number_end}"

# A custom, self-hosted host not in the built-in defaults:
- id: my_gitea
  name: My Gitea
  clone:
    url: "https://gitea.internal.example/{git.org}/{git.repo}.git"
  links:
    directory: "https://gitea.internal.example/{git.org}/{git.repo}/src/commit/{git.commit}/{file.directory}"
    file: "https://gitea.internal.example/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}"
    line: "https://gitea.internal.example/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}#L{line.number}"
    line_range: "https://gitea.internal.example/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}#L{line.number_start}-L{line.number_end}"

# A per-region AWS CodeCommit deployment. git.org is the bare org/account label (no region
# embedded in it); the region is baked directly into this hosts entry's URLs. Define one
# entry per region you use, each with its own id.
- id: aws-codecommit-us-east-1
  name: AWS CodeCommit (us-east-1)
  clone:
    url: "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/{git.repo}"
  links:
    directory: "https://us-east-1.console.aws.amazon.com/codesuite/codecommit/repositories/{git.repo}/browse/{git.commit}/--/{file.directory}?region=us-east-1"
    file: "https://us-east-1.console.aws.amazon.com/codesuite/codecommit/repositories/{git.repo}/browse/{git.commit}/--/{file.path}?region=us-east-1"
    line: "https://us-east-1.console.aws.amazon.com/codesuite/codecommit/repositories/{git.repo}/browse/{git.commit}/--/{file.path}?region=us-east-1&lines={line.number}"
    line_range: "https://us-east-1.console.aws.amazon.com/codesuite/codecommit/repositories/{git.repo}/browse/{git.commit}/--/{file.path}?region=us-east-1&lines={line.number_start}-{line.number_end}"

# A per-project Azure DevOps deployment. git.org is the bare Azure org name; the project is
# baked directly into this hosts entry's URLs. Define one entry per project you use, each
# with its own id. For org-level repos (no project segment), use the built-in azure-devops
# entry directly.
- id: azure-devops-myproject
  name: Azure DevOps (myproject)
  clone:
    url: "https://dev.azure.com/{git.org}/myproject/_git/{git.repo}"
  links:
    directory: "https://dev.azure.com/{git.org}/myproject/_git/{git.repo}?path=/{file.directory}&version=GC{git.commit}"
    file: "https://dev.azure.com/{git.org}/myproject/_git/{git.repo}?path=/{file.path}&version=GC{git.commit}"
    line: "https://dev.azure.com/{git.org}/myproject/_git/{git.repo}?path=/{file.path}&version=GC{git.commit}&line={line.number}&lineEnd={line.number_plus_one}&lineStartColumn=1&lineEndColumn=1&lineStyle=plain"
    line_range: "https://dev.azure.com/{git.org}/myproject/_git/{git.repo}?path=/{file.path}&version=GC{git.commit}&line={line.number_start}&lineEnd={line.number_end_plus_one}&lineStartColumn=1&lineEndColumn=1&lineStyle=plain"

# A GCP Secure Source Manager instance. git.org is the GCP project name; git.repo is the
# repository name. The full instance hostname (instance-projectnumber.location) is baked
# directly into this hosts entry's URLs -- the git clone subdomain appends "-git" before
# the location segment. Define one entry per instance you use, each with its own id.
- id: gcp-ssm-us-central1
  name: GCP Secure Source Manager (us-central1)
  clone:
    url: "https://myinstance-123456789-git.us-central1.sourcemanager.dev/{git.org}/{git.repo}.git"
  links:
    directory: "https://myinstance-123456789.us-central1.sourcemanager.dev/{git.org}/{git.repo}/src/commit/{git.commit}/{file.directory}"
    file: "https://myinstance-123456789.us-central1.sourcemanager.dev/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}"
    line: "https://myinstance-123456789.us-central1.sourcemanager.dev/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}#L{line.number}"
    line_range: "https://myinstance-123456789.us-central1.sourcemanager.dev/{git.org}/{git.repo}/src/commit/{git.commit}/{file.path}#L{line.number_start}-L{line.number_end}"

# ---------------------------------------------------------------------------------------------
# schedules: OPTIONAL. Coarse, scope-based default indexing cadences.
# Run `sourcerer index --config` on a frequent cron (e.g. every 5 minutes) and let the
# schedules control when each source actually re-indexes. A source is indexed only if its
# configured schedule has fired since it was last fully indexed.
#
# Each rule has an optional `git` scope (host / org / repo / ref_type / ref) and a required
# `schedule` (5-field cron or duration string).  The most-specific matching rule wins.
# Scope fields support fnmatch glob wildcards (*  ?  [seq]); `ref_type` accepts exact values
# or bare `*` only (no partial globs on an enum).  Specificity: exact = 2 pts, glob = 1 pt,
# omitted = 0 pts — summed across all five fields.
#
# A source with no matching rule (and no per-source `schedule` field) is always due.
schedules:
# Match all sources on github, in the elastic org — every 3 hours.
- git:
    host: github
    org: elastic
  schedule: "0 */3 * * *"

# More specific: only repos whose name starts with "docs-" — nightly instead.
# (Exact fields beat glob fields, so this rule beats the elastic-org rule for docs repos.)
- git:
    host: github
    org: elastic
    repo: docs-*
  schedule: "0 2 * * *"

# Scope to tag selectors only (any host / org / repo).
- git:
    ref_type: tag
  schedule: "0 1 * * 0"   # weekly on Sundays at 1am

# Catch-all for everything else — once a day.
- schedule: "1d"

# ---------------------------------------------------------------------------------------------
# sources: what to index.
sources:
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: tag

  # Gather a unique set of refs (tags here) whose names match any pattern (a single
  # string is also accepted instead of a list):
  match:
  - v{major}.{minor}.{patch}
  - v{major}.{minor}.{patch}-{prerelease}

  # Starting point for indexing - set exactly ONE of age/date/commit/ref:
  since:
    ref: v8.17.0                  # from the commit this ref points to
    # age: 1y                     # OR: commit within this age of now
    # date: 2025-01-01            # OR: commit on/after this date
    # commit: cfefb3b2378ccbadefa7 # OR: from this commit

  # Keep a ref only while it satisfies EVERY criterion below (omit/null = no
  # constraint at that level). All values inclusive.
  retain:
    age: 2y
    count: 10
    version:                      # requires a versioned match pattern
      majors: 2                   # newest 2 major VALUES (latest + n-1)
      minors: null
      patches: 1                  # newest patch per (major, minor)
      builds: null
    prerelease: superseded        # drop -rc once its final ships

# Index the latest commit of an ad-hoc tag; never prune it (no retain).
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: tag
  match: my-dev-tag

# Index the latest commit of an ad-hoc branch; never prune it.
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: branch
  match: my-dev-branch

# Index main; keep only the newest 5 indexed commits as the head moves.
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: branch
  match: main
  retain:
    count: 5

# Incremental index strategy -- branch-only. Instead of a new commit-addressed snapshot on
# every HEAD advance, content is keyed by git.ref and stays in place: a HEAD advance
# re-indexes only the files `git diff` reports changed (a delta update), rather than the whole
# tree. Good for a fast-moving branch that deploys off main, where staying current matters
# more than retaining per-commit history. `since` and `retain` are not meaningful here (there
# is no per-commit history to filter/retain) and are rejected if given.
- git:
    host: github
    org: elastic
    repo: serverless-gitops
    ref_type: branch
  match: main
  index:
    strategy: incremental         # default: snapshot

# Feature/fix branches as of a week ago; keep the newest commit, prune > 1 month.
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: branch
  match:
  - feat-*
  - fix-*
  since:
    age: 1w
  retain:
    age: 1M
    count: 1

# Pin explicit commits (7-40 hex chars). `since` is not valid; only `age` retention
# (or omit retain to keep forever).
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: commit
  match:
  - cfefb3b2378ccbadefa7
  retain:
    age: 2y

# Route this source's content to a different physical index (per-source), so it lives
# alongside — but separate from — the same repo's default-routed content. `level` sets the
# name granularity (host/org/repo (default)/commit); `suffix` appends `^{suffix}`. Agents
# query the read aliases, which span every leveled/suffixed index, so this is transparent
# to search. Changing level/suffix on an already-indexed source migrates its content to the
# new index on the next `index` run (run `prune` afterward to clean up the old copy).
- git:
    host: github
    org: elastic
    repo: elasticsearch
    ref_type: tag
  match: deploy@{major}
  index:
    level: repo                   # host | org | repo (default) | commit
    suffix: deploy                # -> sourcerer-v3-*~github~elastic~elasticsearch^deploy

# A second host hosting a same-named org/repo is a distinct instance:
- git:
    host: my_gitea
    org: elastic
    repo: elasticsearch
    ref_type: branch
  match: main
  retain:
    count: 1

# AWS CodeCommit: git.org is the bare account/org label; region lives in the host id.
- git:
    host: aws-codecommit-us-east-1
    org: myaccount
    repo: myrepo
    ref_type: branch
  match: main
  retain:
    count: 1

# Azure DevOps: git.org is the bare Azure org name; project lives in the host id.
- git:
    host: azure-devops-myproject
    org: myorg
    repo: myrepo
    ref_type: branch
  match: main
  retain:
    count: 1

# GCP Secure Source Manager: git.org is the GCP project name; instance lives in the host id.
- git:
    host: gcp-ssm-us-central1
    org: my-gcp-project
    repo: myrepo
    ref_type: branch
  match: main
  retain:
    count: 1
