id: sourcerer.refs.list
type: esql
description: list the git refs (branches, tags) indexed for org(s)/repo(s)
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-refs
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND git.commit LIKE ?git_commit
        AND git.ref LIKE ?git_ref
        AND git.ref_type LIKE ?git_ref_type
        // An incremental branch's join doc is never "complete" (only "ready"/"indexing" --
        // see markers.write_incremental_ready/write_incremental_indexing), so the default
        // ?status == "complete" must also surface "ready" docs, or the default (no-arg) call
        // this skill documents would silently omit every incremental branch from the results.
        AND (status LIKE ?status OR (?status == "complete" AND status == "ready"))

    // Format the response
    | SORT indexed_at DESC
    | KEEP git.host, git.org, git.repo, git.ref, git.ref_type, git.ref_key, git.commit, git.commit_date, status, files_count, lines_count, indexed_at, indexing_started_at
    | LIMIT 1000000
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_ref:
      type: string
      description: Filter by ref name(s), e.g. "main" or "v1.*" (supports * and ? wildcards)
      optional: true
      defaultValue: "*"
    git_ref_type:
      type: string
      description: Filter by ref type (can be "branch", "tag", "commit", or any with "*")
      optional: true
      defaultValue: "*"
    status:
      type: string
      description: Filter by ref status. "complete" = fully indexed (default; also includes incremental branches, whose join doc status is "ready" rather than "complete"); "indexing" = currently being indexed; "*" = all statuses.
      optional: true
      defaultValue: "complete"
