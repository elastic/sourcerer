id: sourcerer.files.tail
type: esql
description: tail repo file(s); each line is prefixed with its 1-indexed line number (disable with show_line_numbers=false)
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-lines
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        // A commit SHA (snapshot content) or the exact branch/tag name (incremental
        // content, which has no git.commit of its own) -- whichever this source resolves to.
        AND (git.commit == ?git_ref OR git.ref == ?git_ref)
        AND file.path LIKE ?file_path

    // git.ref_key is purely an internal storage/join key (never a query param): every
    // content doc and its refs join doc share the same ref_key, so this LOOKUP JOIN
    // resolves each row's citable commit regardless of how the row above was scoped --
    // by commit (snapshot) or by ref name (incremental).
    | LOOKUP JOIN sourcerer-refs ON git.ref_key

    // Optional consistency guard: assert the branch hasn't advanced since git_ref was
    // resolved (only meaningful when git_ref names an incremental branch; a no-op filter
    // for a commit-scoped query, since git.commit already equals git_ref there).
    | WHERE git.commit LIKE ?git_commit

    // Glob match (* and **) on file.path
    | EVAL _fp_is_recursive = ?file_path != REPLACE(?file_path, "[*][*]", "")
    | EVAL _fp_segs = LENGTH(?file_path) - LENGTH(REPLACE(?file_path, "/", "")) + 1
    | EVAL _file_segs = MV_COUNT(SPLIT(file.path, "/"))
    | WHERE _fp_is_recursive OR _file_segs == _fp_segs

    // Construct the output for each file based on its lines.
    // _sortkey: internal 10-digit zero-padded line number so (a) duplicate lines stay unique
    // and (b) lexical sort == line order. Stripped back off after the STATS/MV_CONCAT below.
    | EVAL _sortkey = RIGHT(CONCAT("0000000000", TO_STRING(line.number)), 10)
    // _display: optional visible grep -n style prefix ("<line>:<content>"); survives the strip.
    | EVAL _display = CASE(?show_line_numbers == true, CONCAT(TO_STRING(line.number), ":", line.content), line.content)
    | EVAL pair = CONCAT(_sortkey, _display)

    // Collapse each file's lines into one ordered, deduped-safe list (the prefix prevents VALUES from dropping repeated lines)
    | STATS pairs = MV_SORT(VALUES(pair))
        BY git.host, git.org, git.repo, git.commit, file.path, file.size

    // Keep only the last n lines
    | EVAL sliced = MV_SLICE(pairs, 0 - ?n, -1)

    // Join lines with newlines, then strip the 10-digit sort key off each line
    // (the visible show_line_numbers prefix, if any, is the 11th+ chars and is preserved)
    | EVAL output = SUBSTRING(REPLACE(CONCAT("\n", MV_CONCAT(sliced, "\n")), "\n[0-9]{10}", "\n"), 2)

    // Format the response
    | SORT git.host, git.org, git.repo, git.commit, file.path
    | KEEP git.host, git.org, git.repo, git.commit, file.path, file.size, output
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_ref:
      type: string
      description: Exact commit SHA, or exact branch/tag name for an incremental source (no wildcards). Resolve via sourcerer.refs.list first.
      optional: false
    git_commit:
      type: string
      description: Optional consistency guard (supports * wildcards) against the commit resolved by the LOOKUP JOIN -- e.g. assert an incremental branch hasn't advanced since git_ref was resolved. Omit (default "*") to skip the check.
      optional: true
      defaultValue: "*"
    file_path:
      type: string
      description: File path(s) to tail (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: false
    n:
      type: integer
      description: Number of lines to return
      optional: true
      defaultValue: 10
    show_line_numbers:
      type: boolean
      description: Prefix each returned line with its 1-indexed line number (grep -n style, "<line>:<content>")
      optional: true
      defaultValue: true