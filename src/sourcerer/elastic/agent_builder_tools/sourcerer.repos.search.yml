id: sourcerer.repos.search
type: esql
description: find repo(s) whose code best matches a query
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-lines METADATA _score
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND git.commit LIKE ?git_commit
        AND file.path LIKE ?file_path
        AND MATCH(line.content.text, ?q)

    // Glob match (* and **) on file.path
    | EVAL _fp_is_recursive = ?file_path != REPLACE(?file_path, "[*][*]", "")
    | EVAL _fp_segs = LENGTH(?file_path) - LENGTH(REPLACE(?file_path, "/", "")) + 1
    | EVAL _file_segs = MV_COUNT(SPLIT(file.path, "/"))
    | WHERE _fp_is_recursive OR _file_segs == _fp_segs

    // Collapse matching lines to one row per repo + commit
    | STATS
        _commit_file_count_distinct = COUNT_DISTINCT(file.path),
        _commit_score_sum = SUM(_score)
        BY git.host, git.org, git.repo, git.commit

    // Normalize by distinct files so breadth beats duplication
    | EVAL _commit_score_density = _commit_score_sum / SQRT(TO_DOUBLE(_commit_file_count_distinct))

    // Collapse commits to one row per repo
    | STATS
        _repo_ref_count = COUNT(*),
        _repo_score_sum = SUM(_commit_score_density)
        BY git.host, git.org, git.repo

    // Dampen by ref count so repos with more indexed branches don't win on volume alone
    | EVAL score = _repo_score_sum / SQRT(TO_DOUBLE(_repo_ref_count))

    // Format the response
    | SORT score DESC
    | KEEP git.host, git.org, git.repo, score
    | LIMIT ?n
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    file_path:
      type: string
      description: File path(s) to search (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: true
      defaultValue: "**"
    q:
      type: string
      description: Search string
      optional: false
    n:
      type: integer
      description: Number of search results
      optional: true
      defaultValue: 10