id: sourcerer.repos.search
type: esql
description: find repo(s) whose code best matches a query
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-lines METADATA _score
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND (
          // Resolve git_commit, git_ref, and git_ref_type against the small
          // sourcerer-refs index first, rather than evaluating the wildcard
          // match per line against this (far larger) content index.
          // Content docs come in two disjoint shapes:
          //   1. Commit snapshots have git.commit and no git.ref
          //   2. Incremental refs have git.ref and no git.commit
          // So resolution yields two membership sets off the same match:
          //   1. Matching commits, checked against snapshot-shaped rows
          //   2. Matching refs, checked against incremental-shaped rows
          // Includes a consistency guard by only retrieving content from refs
          // whose indexing is complete.
          (git.commit IS NOT NULL AND git.commit IN (
              // Commit snapshots
              FROM sourcerer-refs
              | WHERE git.host LIKE ?git_host
                  AND git.org LIKE ?git_org
                  AND git.repo LIKE ?git_repo
                  AND git.commit LIKE ?git_commit
                  AND git.ref LIKE ?git_ref
                  AND git.ref_type LIKE ?git_ref_type
                  AND status == "complete"
              | KEEP git.commit
              ))
          OR
          (git.ref IS NOT NULL AND git.commit IS NULL AND git.ref IN (
              // Incremental refs
              FROM sourcerer-refs
              | WHERE git.host LIKE ?git_host
                  AND git.org LIKE ?git_org
                  AND git.repo LIKE ?git_repo
                  AND git.commit LIKE ?git_commit
                  AND git.ref LIKE ?git_ref
                  AND git.ref_type LIKE ?git_ref_type
                  AND status == "complete"
              | KEEP git.ref
              ))
          )
        AND file.path LIKE ?file_path
        AND MATCH(line.content.text, ?q)

    // Glob match (* and **) on file.path
    | EVAL _fp_is_recursive = ?file_path != REPLACE(?file_path, "[*][*]", "")
    | EVAL _fp_segs = LENGTH(?file_path) - LENGTH(REPLACE(?file_path, "/", "")) + 1
    | EVAL _file_segs = MV_COUNT(SPLIT(file.path, "/"))
    | WHERE _fp_is_recursive OR _file_segs == _fp_segs

    // Collapse matching lines to one row per (repo, ref) with COALESCE(git.ref, git.commit).
    // git.ref is checked first because it's the only field that distinguishes
    // two incremental branches that happen to currently point at the same commit
    // (this query never joins, so an incremental row's git.commit stays NULL
    // throughout. There's nothing for the COALESCE to prefer it over anyway).
    // For snapshot rows git.ref is NULL, so this falls through to git.commit,
    // which is already a correct per-commit identity since snapshot content is
    // naturally deduplicated by commit. Same two reasons as before: incremental
    // rows have no commit of their own to group by, and two refs sharing a
    // commit must not collapse into one bucket.
    | EVAL _ref_ish = COALESCE(git.ref, git.commit)
    | STATS
        _commit_file_count_distinct = COUNT_DISTINCT(file.path),
        _commit_score_sum = SUM(_score)
        BY git.host, git.org, git.repo, _ref_ish

    // Normalize by distinct files so breadth beats duplication
    | EVAL _commit_score_density = _commit_score_sum / SQRT(TO_DOUBLE(_commit_file_count_distinct))

    // Collapse refs to one row per repo
    | STATS
        _repo_ref_count = COUNT(*),
        _repo_score_sum = SUM(_commit_score_density)
        BY git.host, git.org, git.repo

    // Dampen by ref count so repos with more indexed branches don't win on volume alone
    | EVAL score = _repo_score_sum / SQRT(TO_DOUBLE(_repo_ref_count))

    // Format the response
    | SORT score DESC
    | KEEP git.host, git.org, git.repo, score
    | LIMIT ?limit
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_ref:
      type: string
      description: Filter by ref name(s), e.g. "main" or "v1.*" (supports * and ? wildcards)
      optional: true
      defaultValue: "*"
    git_ref_type:
      type: string
      description: Filter by ref type (can be "branch", "tag", "commit", or any with "*")
      optional: true
      defaultValue: "*"
    file_path:
      type: string
      description: File path(s) to search (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: true
      defaultValue: "**"
    q:
      type: string
      description: Search string
      optional: false
    limit:
      type: integer
      description: Number of search results
      optional: true
      defaultValue: 10