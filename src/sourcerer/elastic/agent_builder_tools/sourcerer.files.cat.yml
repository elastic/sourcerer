id: sourcerer.files.cat
type: esql
description: cat repo file(s); each line is prefixed with its 1-indexed line number (disable with show_line_numbers=false)
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-lines
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND git.ref_key IN (
          // Resolve ?git_commit_ish against the small sourcerer-refs lookup table first, rather than
          // evaluating the LIKE/OR wildcard match per line against this (far larger) content index.
          // The subquery narrows host/org/repo/status/commit-ish down to a set of git.ref_key values
          // once; the outer query then does a cheap membership check instead of a wildcard match on
          // every row.
            FROM sourcerer-refs
            | WHERE git.host LIKE ?git_host
                AND git.org LIKE ?git_org
                AND git.repo LIKE ?git_repo
                AND status == "complete"
                AND (git.commit LIKE ?git_commit_ish OR git.ref LIKE ?git_commit_ish)
            | KEEP git.ref_key
          )
        AND file.path LIKE ?file_path

    // git.ref_key is purely an internal storage/join key (never a query param): every
    // content doc and its refs join doc share the same ref_key, so this LOOKUP JOIN
    // resolves each row's citable commit regardless of how the row above was scoped --
    // by commit (snapshot) or by ref name (incremental).
    | LOOKUP JOIN sourcerer-refs ON git.ref_key

    // Consistency guard: only serve content from a ref whose latest index is complete. This
    // excludes the torn/partial-read window while an incremental branch is mid-reindex (its refs
    // join doc is status:"indexing" until the new commit's content is fully published). A no-op
    // for snapshot content, whose join doc is always status:"complete". `status` lives only on
    // refs docs, so after the join it unambiguously means the joined ref's status.
    | WHERE status == "complete"

    // Glob match (* and **) on file.path
    | EVAL _fp_is_recursive = ?file_path != REPLACE(?file_path, "[*][*]", "")
    | EVAL _fp_segs = LENGTH(?file_path) - LENGTH(REPLACE(?file_path, "/", "")) + 1
    | EVAL _file_segs = MV_COUNT(SPLIT(file.path, "/"))
    | WHERE _fp_is_recursive OR _file_segs == _fp_segs

    // Construct the output for each file based on its lines.
    // _sortkey: internal 10-digit zero-padded line number so (a) duplicate lines stay unique
    // and (b) lexical sort == line order. Stripped back off after the STATS/MV_CONCAT below.
    | EVAL _sortkey = RIGHT(CONCAT("0000000000", TO_STRING(line.number)), 10)
    // _display: optional visible grep -n style prefix ("<line>:<content>"); survives the strip.
    | EVAL _display = CASE(?show_line_numbers == true, CONCAT(TO_STRING(line.number), ":", line.content), line.content)
    | EVAL pair = CONCAT(_sortkey, _display)

    // Collapse each file's lines into one ordered, deduped-safe list (the prefix prevents VALUES from dropping repeated lines)
    | STATS pairs = MV_SORT(VALUES(pair))
        BY git.host, git.org, git.repo, git.commit, file.path, file.size

    // Join lines with newlines, then strip the 10-digit sort key off each line
    // (the visible show_line_numbers prefix, if any, is the 11th+ chars and is preserved)
    | EVAL output = SUBSTRING(REPLACE(CONCAT("\n", MV_CONCAT(pairs, "\n")), "\n[0-9]{10}", "\n"), 2)

    // Format the response. limit caps the number of files returned, not the
    // number of lines the STATS above had to read to build them. Each row
    // here is a whole file's content, the heaviest row in this toolset, so
    // the default is deliberately low rather than "return everything".
    | SORT git.host, git.org, git.repo, git.commit, file.path
    | KEEP git.host, git.org, git.repo, git.commit, file.path, output
    | LIMIT ?limit
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit_ish:
      type: string
      description: Filter by git commit(s) or ref(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    file_path:
      type: string
      description: File path(s) to cat (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: false
    show_line_numbers:
      type: boolean
      description: Prefix each returned line with its 1-indexed line number (grep -n style, "<line>:<content>")
      optional: true
      defaultValue: true
    limit:
      type: integer
      description: Maximum number of files to return. Each result is a whole file. Scope file_path narrowly rather than raising this to pull back many files at once.
      optional: true
      defaultValue: 10