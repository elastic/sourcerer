id: sourcerer.files.head
type: esql
description: head repo file(s)
tags: []
configuration:
  query: |-
    // Scope to EXACTLY ONE schema: v1 snapshot by git.commit when no git_ref_key is supplied,
    // or v2 incremental by exact git.ref_key when it is. The branches are mutually exclusive.
    FROM sourcerer-v1-lines*, sourcerer-v2-lines* METADATA _index
    | WHERE (?git_ref_key == "" AND _index LIKE "sourcerer-v1-lines*"
                AND git.org LIKE ?git_org AND git.repo LIKE ?git_repo AND git.commit LIKE ?git_commit)
         OR (?git_ref_key != "" AND _index LIKE "sourcerer-v2-lines*"
                AND git.ref_key == ?git_ref_key)
    | WHERE file.path LIKE ?file_path AND MATCH(file.path, ?file_path)

    // Attach the completed commit for v2 rows via the refs lookup join on exact git.ref_key.
    | EVAL _org = git.org, _repo = git.repo, _commit = git.commit
    | LOOKUP JOIN sourcerer-v2-refs ON git.ref_key
    | EVAL git.org = _org, git.repo = _repo, git.commit = COALESCE(git.commit, _commit)

    // Construct the output for each file based on its lines
    // Prefix each line with its zero-padded line number so: (a) duplicate lines stay unique; and (b) lexical sort = line order
    | EVAL pair = CONCAT(RIGHT(CONCAT("0000000000", TO_STRING(line.number)), 10), line.content)

    // Collapse each file's lines into one ordered, deduped-safe list (the prefix prevents VALUES from dropping repeated lines)
    | STATS pairs = MV_SORT(VALUES(pair))
        BY git.org, git.repo, git.commit, file.path

    // Keep only the first n lines
    | EVAL sliced = MV_SLICE(pairs, 0, ?n - 1)

    // Join lines with newlines, then strip the 10-digit prefix off each line
    | EVAL content = SUBSTRING(REPLACE(CONCAT("\n", MV_CONCAT(sliced, "\n")), "\n[0-9]{10}", "\n"), 2)

    // Format the response
    | KEEP git.org, git.repo, git.commit, file.path, content
    | SORT git.org, git.repo, git.commit, file.path
  params:
    git_org:
      type: string
      description: Filter by git org(s)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) for v1 snapshot refs (supports * wildcards). Ignored when git_ref_key is set.
      optional: true
      defaultValue: "*"
    git_ref_key:
      type: string
      description: Exact ref key of a v2 incremental branch (from sourcerer.refs.list). When set, head targets that branch's incremental content instead of snapshot content; leave empty for snapshot (git_commit) queries.
      optional: true
      defaultValue: ""
    file_path:
      type: string
      description: File path(s) to head (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: false
    n:
      type: integer
      description: Number of lines to return
      optional: true
      defaultValue: 10
