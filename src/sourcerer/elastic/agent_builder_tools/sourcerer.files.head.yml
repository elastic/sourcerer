id: sourcerer.files.head
type: esql
description: head repo file(s); each line is prefixed with its 1-indexed line number (disable with show_line_numbers=false)
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-lines
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND (
          // Resolve git_commit, git_ref, and git_ref_type against the small
          // sourcerer-refs index first, rather than evaluating the wildcard
          // match per line against this (far larger) content index.
          // Content docs come in two disjoint shapes:
          //   1. Commit snapshots have git.commit and no git.ref
          //   2. Incremental refs have git.ref and no git.commit
          // So resolution yields two membership sets off the same match:
          //   1. Matching commits, checked against snapshot-shaped rows
          //   2. Matching refs, checked against incremental-shaped rows
          (git.commit IS NOT NULL AND git.commit IN (
              // Commit snapshots
              FROM sourcerer-refs
              | WHERE git.host LIKE ?git_host
                  AND git.org LIKE ?git_org
                  AND git.repo LIKE ?git_repo
                  AND git.commit LIKE ?git_commit
                  AND git.ref LIKE ?git_ref
                  AND git.ref_type LIKE ?git_ref_type
              | KEEP git.commit
              ))
          OR
          (git.ref IS NOT NULL AND git.commit IS NULL AND git.ref IN (
              // Incremental refs
              FROM sourcerer-refs
              | WHERE git.host LIKE ?git_host
                  AND git.org LIKE ?git_org
                  AND git.repo LIKE ?git_repo
                  AND git.commit LIKE ?git_commit
                  AND git.ref LIKE ?git_ref
                  AND git.ref_type LIKE ?git_ref_type
              | KEEP git.ref
              ))
          )
        AND file.path LIKE ?file_path

    // Branch by content-doc shape to resolve git.commit for incremental refs:
    // 1. Snapshot rows already carry git.commit on the content doc (no join needed).
    // 2. Incremental rows carry only git.ref; the LOOKUP JOIN resolves the citable
    //    git.commit from the refs join doc (one doc per (host,org,repo,ref)).
    | FORK
        ( WHERE git.commit IS NOT NULL )
        ( WHERE git.ref IS NOT NULL AND git.commit IS NULL
            | LOOKUP JOIN sourcerer-refs ON git.host, git.org, git.repo, git.ref, git.ref_type )

    // Glob match (* and **) on file.path
    | EVAL _fp_is_recursive = ?file_path != REPLACE(?file_path, "[*][*]", "")
    | EVAL _fp_segs = LENGTH(?file_path) - LENGTH(REPLACE(?file_path, "/", "")) + 1
    | EVAL _file_segs = MV_COUNT(SPLIT(file.path, "/"))
    | WHERE _fp_is_recursive OR _file_segs == _fp_segs

    // Construct the output for each file based on its lines.
    // _sortkey: internal 10-digit zero-padded line number so (a) duplicate lines stay unique
    // and (b) lexical sort == line order. Stripped back off after the STATS/MV_CONCAT below.
    | EVAL _sortkey = RIGHT(CONCAT("0000000000", TO_STRING(line.number)), 10)
    // _display: optional visible grep -n style prefix ("<line>:<content>"); survives the strip.
    | EVAL _display = CASE(?show_line_numbers == true, CONCAT(TO_STRING(line.number), ":", line.content), line.content)
    | EVAL pair = CONCAT(_sortkey, _display)

    // Collapse each file's lines into one ordered, deduped-safe list (the prefix prevents VALUES from dropping repeated lines)
    | STATS pairs = MV_SORT(VALUES(pair))
        BY git.host, git.org, git.repo, git.commit, file.path, file.size

    // Keep only the first n lines
    | EVAL sliced = MV_SLICE(pairs, 0, ?n - 1)

    // Join lines with newlines, then strip the 10-digit sort key off each line
    // (the visible show_line_numbers prefix, if any, is the 11th+ chars and is preserved)
    | EVAL output = SUBSTRING(REPLACE(CONCAT("\n", MV_CONCAT(sliced, "\n")), "\n[0-9]{10}", "\n"), 2)

    // Format the response
    | SORT git.host, git.org, git.repo, git.commit, file.path
    | KEEP git.host, git.org, git.repo, git.commit, file.path, file.size, output
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_ref:
      type: string
      description: Filter by ref name(s), e.g. "main" or "v1.*" (supports * and ? wildcards)
      optional: true
      defaultValue: "*"
    git_ref_type:
      type: string
      description: Filter by ref type (can be "branch", "tag", "commit", or any with "*")
      optional: true
      defaultValue: "*"
    file_path:
      type: string
      description: File path(s) to head (supports * and ** glob syntax, e.g. src/test, src/*/resources, src/**, src/**/*.xml)
      optional: false
    n:
      type: integer
      description: Number of lines to return
      optional: true
      defaultValue: 10
    show_line_numbers:
      type: boolean
      description: Prefix each returned line with its 1-indexed line number (grep -n style, "<line>:<content>")
      optional: true
      defaultValue: true