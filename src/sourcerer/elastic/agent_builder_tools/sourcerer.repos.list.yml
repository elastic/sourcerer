id: sourcerer.repos.list
type: esql
description: list the git org(s)/repo(s) indexed
tags: []
configuration:
  query: |-
    // Scope the search
    FROM sourcerer-refs
    | WHERE git.host LIKE ?git_host
        AND git.org LIKE ?git_org
        AND git.repo LIKE ?git_repo
        AND git.commit LIKE ?git_commit
        AND git.ref LIKE ?git_ref
        AND git.ref_type LIKE ?git_ref_type
        AND status LIKE ?status

    // Format the response
    | EVAL repo_line = CONCAT(git.org, "/", git.repo)
    | STATS repos = VALUES(repo_line) BY git.host
    | EVAL repos = MV_SORT(repos)
    | EVAL output = CONCAT("# host: ", git.host, "\n", MV_CONCAT(repos, "\n"))
    | KEEP output
    | LIMIT 1000000
  params:
    git_host:
      type: string
      description: Filter by git host(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_org:
      type: string
      description: Filter by git org(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_repo:
      type: string
      description: Filter by git repo(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_commit:
      type: string
      description: Filter by git commit(s) (supports * wildcards)
      optional: true
      defaultValue: "*"
    git_ref:
      type: string
      description: Filter by ref name(s), e.g. "main" or "v1.*" (supports * and ? wildcards)
      optional: true
      defaultValue: "*"
    git_ref_type:
      type: string
      description: Filter by ref type (can be "branch", "tag", "commit", or any with "*")
      optional: true
      defaultValue: "*"
    status:
      type: string
      description: Filter by ref status. "complete" = fully indexed (default); "indexing" = currently being indexed; "*" = all statuses.
      optional: true
      defaultValue: "complete"
